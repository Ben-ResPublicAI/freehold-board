<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Freehold mijlpalen</title>
<meta name="description" content="Mijlpalenbord van de oprichters van Freehold Works.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/freehold-icoon-64.svg" type="image/svg+xml">
<link rel="preload" href="fonts/source-serif-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/inter-tight-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
  /* Fonts are served from this origin. The board makes no request to any host
     other than its own and the Supabase project it is configured for. */
  @font-face{font-family:'Inter Tight';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/inter-tight-400.woff2') format('woff2')}
  @font-face{font-family:'Inter Tight';font-style:normal;font-weight:500;font-display:swap;src:url('fonts/inter-tight-500.woff2') format('woff2')}
  @font-face{font-family:'Inter Tight';font-style:normal;font-weight:700;font-display:swap;src:url('fonts/inter-tight-700.woff2') format('woff2')}
  @font-face{font-family:'Source Serif 4';font-style:normal;font-weight:400;font-display:swap;src:url('fonts/source-serif-400.woff2') format('woff2')}
  @font-face{font-family:'Source Serif 4';font-style:normal;font-weight:600;font-display:swap;src:url('fonts/source-serif-600.woff2') format('woff2')}

  /* Palette per the Freehold huisstijl, section 10. Kalk is the carrier,
     basalt the text, verdigris the mark. Oker is atmosphere and marks shared
     milestones. Signaal warns and does nothing else. */
  :root{
    --ground:#F5F3EE;          /* kalk */
    --ground-deep:#EFEDE6;     /* column surface */
    --surface:#FBFAF7;         /* card surface */
    --surface-raised:#FFFFFF;
    --ink:#14181D;             /* basalt */
    --ink-2:#2A3138;           /* basalt light */
    --ink-3:#5C6470;
    --line:#D9D4CA;
    --line-strong:#C7BFB1;     /* klei */
    --clay:#C7BFB1;
    --accent:#14796A;          /* verdigris */
    --accent-deep:#0C5347;
    --accent-ink:#F5F3EE;      /* text on accent */
    --accent-tint:#E4EFEB;
    --ochre:#C08A3E;
    --ochre-tint:#F3E9D8;
    --signal:#E0623A;
    --signal-tint:#F8E3DA;
    --shadow:0 1px 2px rgba(20,24,29,.06), 0 6px 20px rgba(20,24,29,.06);
    --radius:6px;
    --gutter:24px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#14181D;
      --ground-deep:#1A1F25;
      --surface:#21272E;
      --surface-raised:#2A3138;
      --ink:#F5F3EE;
      --ink-2:#D9D4CA;
      --ink-3:#A8A194;
      --line:#2F373F;
      --line-strong:#3E474F;
      --clay:#4C5560;
      --accent:#2FA891;        /* verdigris light, only on a dark ground */
      --accent-deep:#5CC4AE;
      --accent-ink:#14181D;
      --accent-tint:#1D3B36;
      --ochre:#D9A65C;
      --ochre-tint:#3A2F1F;
      --signal:#F07C57;
      --signal-tint:#452A21;
      --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --ground:#14181D;
    --ground-deep:#1A1F25;
    --surface:#21272E;
    --surface-raised:#2A3138;
    --ink:#F5F3EE;
    --ink-2:#D9D4CA;
    --ink-3:#A8A194;
    --line:#2F373F;
    --line-strong:#3E474F;
    --clay:#4C5560;
    --accent:#2FA891;
    --accent-deep:#5CC4AE;
    --accent-ink:#14181D;
    --accent-tint:#1D3B36;
    --ochre:#D9A65C;
    --ochre-tint:#3A2F1F;
    --signal:#F07C57;
    --signal-tint:#452A21;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;height:100%}
  body{
    margin:0;height:100%;
    background:var(--ground);color:var(--ink);
    font-family:'Inter Tight',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
    font-size:15px;line-height:1.5;
    font-variant-numeric:tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{font-family:'Source Serif 4',Georgia,'Times New Roman',serif;font-weight:600;line-height:1.2;margin:0;text-wrap:balance}
  p{margin:0}
  a{color:var(--accent)}
  button,input,select,textarea{font:inherit;color:inherit}
  button{cursor:pointer}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  [hidden]{display:none !important}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

  /* ---------- App frame ---------- */
  .app{height:100%;display:flex;flex-direction:column}
  .topbar{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    padding:12px var(--gutter);border-bottom:1px solid var(--line);
    background:var(--ground);
  }
  .lockup{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
  .lockup svg{width:38px;height:30px;display:block}
  .wordmark{font-size:22px;letter-spacing:-0.13px;line-height:1}
  .wordmark b{font-weight:700}
  .wordmark span{font-weight:400}
  .topbar .app-title{font-family:'Source Serif 4',Georgia,serif;font-size:18px;color:var(--ink-2);padding-left:16px;border-left:1px solid var(--line);line-height:1.2}
  .nav{display:flex;gap:2px;margin-left:auto}
  .nav button{
    background:none;border:0;border-radius:var(--radius);padding:7px 12px;
    color:var(--ink-2);font-weight:500;
  }
  .nav button[aria-current="page"]{background:var(--accent-tint);color:var(--accent-deep)}
  .nav button:hover{color:var(--ink)}
  .who{display:flex;align-items:center;gap:10px}
  .peers{display:flex}
  .avatar{
    width:28px;height:28px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;letter-spacing:.3px;
    background:var(--accent);color:var(--accent-ink);
    border:2px solid var(--ground);
  }
  .avatar.sm{width:22px;height:22px;font-size:9px;border-width:1.5px}
  .avatar.extern{background:var(--clay);color:var(--ink)}
  .avatar.intern{background:var(--ink-2);color:var(--ground)}
  .peers .avatar + .avatar{margin-left:-8px}
  .peers .avatar.me{outline:2px solid var(--accent);outline-offset:0}
  .who .name{font-weight:500}
  .who .linkbtn{background:none;border:0;color:var(--ink-3);padding:0;text-decoration:underline;text-underline-offset:3px}

  /* ---------- Filter bar ---------- */
  .filters{
    display:flex;gap:16px;align-items:center;flex-wrap:wrap;
    padding:10px var(--gutter);border-bottom:1px solid var(--line);
    background:var(--ground);
  }
  .chipgroup{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
  .chipgroup .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);margin-right:4px;font-weight:500}
  .chip{
    border:1px solid var(--line-strong);background:transparent;border-radius:999px;
    padding:3px 11px;font-size:13px;color:var(--ink-2);line-height:1.4;
  }
  .chip:hover{border-color:var(--ink-3)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
  .chip.ochre[aria-pressed="true"]{background:var(--ochre);border-color:var(--ochre);color:var(--ink)}
  .search{
    border:1px solid var(--line-strong);border-radius:999px;background:var(--surface);
    padding:5px 12px;min-width:200px;font-size:14px;
  }
  .search::placeholder{color:var(--ink-3)}
  .filters .spacer{flex:1}
  .btn{
    border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--radius);
    padding:6px 12px;font-weight:500;font-size:14px;line-height:1.4;color:var(--ink);
  }
  .btn:hover{border-color:var(--ink-3)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{background:var(--accent-deep);border-color:var(--accent-deep)}
  .btn.danger{color:var(--signal);border-color:var(--signal)}
  .btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
  .btn:disabled{opacity:.5;cursor:default}

  /* ---------- Board ---------- */
  .main{flex:1;min-height:0;position:relative}
  .view{height:100%;overflow:auto}
  .board{
    height:100%;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);
    gap:14px;padding:16px var(--gutter) 24px;overflow-x:auto;overflow-y:hidden;
  }
  .board.lanes{grid-auto-flow:row;grid-auto-columns:unset;grid-template-columns:1fr;overflow-y:auto;gap:22px}
  .lane{display:grid;grid-template-columns:repeat(5,minmax(240px,1fr));gap:14px;min-width:0}
  .lane-head{
    grid-column:1/-1;display:flex;align-items:baseline;gap:12px;
    padding-bottom:6px;border-bottom:1px solid var(--line);
  }
  .lane-head h2{font-size:18px}
  .lane-head .meta{color:var(--ink-3);font-size:13px}
  .col{
    display:flex;flex-direction:column;min-height:0;
    background:var(--ground-deep);border-radius:8px;
  }
  .col-head{
    display:flex;align-items:baseline;gap:8px;padding:10px 12px 8px;
    font-weight:500;color:var(--ink-2);
  }
  .col-head .count{color:var(--ink-3);font-size:13px;margin-left:auto}
  .col-head .dot{width:8px;height:8px;border-radius:50%;background:var(--clay);flex:none;position:relative;top:-1px}
  .col[data-kolom="in_uitvoering"] .dot{background:var(--accent)}
  .col[data-kolom="wacht_op"] .dot{background:var(--ochre)}
  .col[data-kolom="gehaald"] .dot{background:var(--accent-deep)}
  .col[data-kolom="vervallen"] .dot{background:var(--ink-3)}
  .col-list{
    flex:1;min-height:60px;overflow-y:auto;padding:0 8px 8px;
    display:flex;flex-direction:column;gap:8px;
  }
  .lanes .col-list{overflow:visible}
  .col-list.over{outline:2px dashed var(--accent);outline-offset:-4px;border-radius:8px}
  .empty{
    color:var(--ink-3);font-size:13px;text-align:left;padding:12px 6px;
    border:1px dashed var(--line-strong);border-radius:var(--radius);
  }

  /* ---------- Card ---------- */
  .card{
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:10px 12px 10px;cursor:grab;position:relative;
    display:flex;flex-direction:column;gap:7px;
    transition:box-shadow .12s ease, transform .12s ease;
  }
  .card:hover{box-shadow:var(--shadow);border-color:var(--line-strong)}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.45}
  .card.late{border-left:3px solid var(--signal);padding-left:10px}
  .card.done .title{color:var(--ink-3)}
  .card-top{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3)}
  .card-top .nr{font-weight:500;letter-spacing:.02em}
  .card-top .period{margin-left:auto}
  .card .title{
    font-family:'Source Serif 4',Georgia,serif;font-size:15px;line-height:1.35;
    font-weight:400;color:var(--ink);
    display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;
  }
  .card-bottom{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-3);min-height:22px}
  .card-bottom .date{font-weight:500;color:var(--ink-2)}
  .card.late .date{color:var(--signal)}
  .card-bottom .right{margin-left:auto;display:flex;align-items:center;gap:8px}
  .tag{border-radius:3px;padding:1px 6px;font-size:11px;font-weight:500;line-height:1.5;letter-spacing:.02em}
  .tag.shared{background:var(--ochre-tint);color:var(--ink)}
  .tag.group{background:var(--accent-tint);color:var(--accent-deep)}
  .ico{display:inline-flex;align-items:center;gap:3px}
  .ico svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
  .stack{display:flex}
  .stack .avatar + .avatar{margin-left:-6px}

  /* ---------- Drawer ---------- */
  .drawer-backdrop{position:absolute;inset:0;background:rgba(20,24,29,.28);z-index:20}
  .drawer{
    position:absolute;top:0;right:0;bottom:0;width:min(560px,100%);z-index:21;
    background:var(--ground);border-left:1px solid var(--line);
    display:flex;flex-direction:column;box-shadow:var(--shadow);
  }
  .drawer-head{display:flex;align-items:center;gap:10px;padding:14px 20px;border-bottom:1px solid var(--line)}
  .drawer-head .nr{color:var(--ink-3);font-size:13px;font-weight:500}
  .drawer-head .close{margin-left:auto}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 20px 32px;display:flex;flex-direction:column;gap:20px}
  .field{display:flex;flex-direction:column;gap:5px}
  .field label,.field .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500}
  .field input[type=text],.field input[type=date],.field input[type=number],.field select,.field textarea{
    border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);
    padding:7px 10px;font-size:14px;width:100%;
  }
  .field textarea{min-height:64px;resize:vertical;line-height:1.45}
  .field textarea.title{font-family:'Source Serif 4',Georgia,serif;font-size:18px;line-height:1.3;min-height:56px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .hint{font-size:12px;color:var(--ink-3)}
  .section-title{font-family:'Inter Tight',sans-serif;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500;display:flex;align-items:center;gap:8px}
  .section-title .n{color:var(--ink-3);font-weight:400;text-transform:none;letter-spacing:0}
  .checklist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
  .checklist li{display:flex;align-items:flex-start;gap:8px;padding:4px 0}
  .checklist input[type=checkbox]{margin-top:4px;accent-color:var(--accent)}
  .checklist .txt{flex:1}
  .checklist li.done .txt{color:var(--ink-3);text-decoration:line-through}
  .checklist .rm{background:none;border:0;color:var(--ink-3);padding:0 4px}
  .checklist .rm:hover{color:var(--signal)}
  .addline{display:flex;gap:8px}
  .addline input{flex:1;border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:6px 10px;font-size:14px}
  .people-pick{display:flex;flex-wrap:wrap;gap:6px}
  .pick{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);
    background:var(--surface);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;
  }
  .pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);color:var(--accent-deep)}
  .comments{display:flex;flex-direction:column;gap:12px}
  .comment{display:grid;grid-template-columns:28px 1fr;gap:10px}
  .comment .meta{font-size:12px;color:var(--ink-3);display:flex;gap:8px;align-items:baseline}
  .comment .meta b{color:var(--ink-2);font-weight:500}
  .comment .body{white-space:pre-wrap;line-height:1.5}
  .comment-form{display:flex;flex-direction:column;gap:8px}
  .comment-form textarea{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:8px 10px;min-height:70px;resize:vertical}
  .comment-form .actions{display:flex;gap:8px;justify-content:flex-end}
  .activity{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--ink-2)}
  .activity li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:baseline}
  .activity time{color:var(--ink-3);font-size:12px;white-space:nowrap}
  .drawer-foot{display:flex;gap:8px;padding:12px 20px;border-top:1px solid var(--line);align-items:center;flex-wrap:wrap}
  .drawer-foot .spacer{flex:1}
  .saved{font-size:12px;color:var(--ink-3)}
  .saved.ok{color:var(--accent-deep)}
  .saved.err{color:var(--signal)}

  /* ---------- Pages (Mensen, Activiteit, Instellingen) ---------- */
  .page{padding:24px var(--gutter) 48px;max-width:1080px}
  .page h1{font-size:26px;margin-bottom:6px}
  .page .lede{color:var(--ink-2);max-width:66ch;margin-bottom:22px}
  .page-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px}
  .page-head .btn{margin-left:auto}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
  table{border-collapse:collapse;width:100%;font-size:14px}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:500;background:var(--ground-deep)}
  tr:last-child td{border-bottom:0}
  td .sub{display:block;color:var(--ink-3);font-size:12px}
  .pill{display:inline-block;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:500;border:1px solid var(--line-strong);color:var(--ink-2)}
  .pill.oprichter{background:var(--accent-tint);border-color:transparent;color:var(--accent-deep)}
  .pill.intern{background:var(--ground-deep);border-color:transparent}
  .pill.off{color:var(--ink-3);border-style:dashed}
  tr.inactive td{color:var(--ink-3)}
  .settings{display:flex;flex-direction:column;gap:28px;max-width:560px}
  .settings .field input{max-width:220px}
  .settings .block{display:flex;flex-direction:column;gap:10px}
  .settings .block h2{font-size:18px}
  .settings .block p{color:var(--ink-2);max-width:60ch}
  .settings .actions{display:flex;gap:8px;flex-wrap:wrap}

  /* ---------- Modal (person editor) ---------- */
  .modal-backdrop{position:fixed;inset:0;background:rgba(20,24,29,.35);z-index:40;display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto}
  .modal{background:var(--ground);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);box-shadow:var(--shadow);padding:20px 22px 18px;display:flex;flex-direction:column;gap:16px}
  .modal h2{font-size:20px}
  .checks{display:flex;flex-direction:column;gap:6px}
  .checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;text-transform:none;letter-spacing:0;color:var(--ink)}
  .checks input{accent-color:var(--accent);margin-top:3px}
  .checks .hint{margin-left:24px}
  .modal .actions{display:flex;gap:8px;justify-content:flex-end}

  /* ---------- Sign in ---------- */
  .gate{min-height:100%;display:grid;place-items:center;padding:32px var(--gutter)}
  .gate-card{width:min(420px,100%);display:flex;flex-direction:column;gap:18px}
  .gate .lockup svg{width:56px;height:44px}
  .gate .wordmark{font-size:30px}
  .gate h1{font-size:22px}
  .gate p{color:var(--ink-2);line-height:1.55}
  .gate form{display:flex;flex-direction:column;gap:10px}
  .gate input[type=email]{border:1px solid var(--line-strong);border-radius:var(--radius);background:var(--surface);padding:9px 12px;font-size:15px}
  .gate .status{font-size:13px;color:var(--ink-2);min-height:1.4em}
  .gate .status.err{color:var(--signal)}
  .gate .baseline{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:500}
  .divider{display:flex;align-items:center;gap:10px;color:var(--ink-3);font-size:12px}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

  /* ---------- Toast ---------- */
  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:var(--ink);color:var(--ground);padding:9px 14px;border-radius:var(--radius);
    font-size:14px;box-shadow:var(--shadow);z-index:60;max-width:calc(100% - 32px);
  }
  .toast.err{background:var(--signal);color:#fff}

  /* ---------- Demo banner ---------- */
  .demo-banner{background:var(--ochre-tint);color:var(--ink);font-size:13px;padding:6px var(--gutter);border-bottom:1px solid var(--line)}

  @media (max-width:760px){
    :root{--gutter:16px}
    .topbar{gap:12px}
    .topbar .app-title{display:none}
    .nav{order:3;width:100%;margin-left:0}
    .board{grid-auto-columns:minmax(84vw,1fr)}
    .lane{grid-template-columns:repeat(5,minmax(84vw,1fr));overflow-x:auto}
    .row,.row3{grid-template-columns:1fr}
    .drawer{width:100%}
    .search{min-width:0;flex:1}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important}
  }
</style>
</head>
<body>
<div id="app" class="app"></div>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
